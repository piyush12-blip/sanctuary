<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow, noarchive, noimageindex, nosnippet">
    <title>Who Knows | Sanctuary</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
    <script src="https://unpkg.com/lenis@1.1.14/dist/lenis.min.js"></script>

    <style>
        :root { 
            --accent: #7000ff; 
            --organimo-purple: #7000ff; 
            --organimo-pink: #ff0077; 
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #000; color: #fff; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; overflow: hidden; user-select: none; }

        /* --- 🛡️ CINEMATICS --- */
        .grain {
            position: fixed; inset: 0; z-index: 90; pointer-events: none;
            background: url('https://upload.wikimedia.org/wikipedia/commons/7/76/1k_element_noise_fbm.png');
            opacity: 0.04; animation: noise 0.2s infinite;
        }
        @keyframes noise { 0%, 100% { transform: translate(0,0); } 10% { transform: translate(-1%,-1%); } 50% { transform: translate(1%,1%); } }

        #webgl-container { position: fixed; inset: 0; z-index: 1; opacity: 0; transition: opacity 2s ease; }

        /* --- 🚪 PRELOADER & GATES --- */
        #boot, #login, #audio-gate { position: fixed; inset: 0; z-index: 500; background: #000; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .loading-text { font-family: monospace; font-size: 2.5rem; letter-spacing: 5px; color: var(--accent); text-shadow: 0 0 10px var(--accent); }
        .gate-btn { background: none; border: 1px solid var(--accent); color: var(--accent); padding: 12px 35px; cursor: pointer; margin: 10px; font-family: monospace; font-size: 10px; letter-spacing: 3px; transition: 0.3s; border-radius: 50px; }
        .gate-btn:hover { background: var(--accent); color: #000; box-shadow: 0 0 20px var(--accent); }
        
        #pass { background: none; border: none; border-bottom: 2px solid #222; color: #fff; text-align: center; font-size: 2rem; outline: none; letter-spacing: 12px; width: 240px; }
        #pass:focus { border-bottom-color: var(--accent); }

        /* --- 🏛️ VAULT INTERFACE --- */
        #hero { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; pointer-events: none; z-index: 100; }
        h1 { font-size: 10vw; font-weight: 900; text-align: center; color: #fff; opacity: 0; line-height: 0.9; mix-blend-mode: screen; }

        #typewriter { position: fixed; bottom: 25%; width: 100%; text-align: center; font-family: monospace; color: var(--accent); letter-spacing: 3px; z-index: 100; font-size: 13px; }
        #credits { position: fixed; bottom: 10px; left: 50%; transform: translateX(-50%); font-size: 8px; letter-spacing: 2px; color: rgba(255,255,255,0.2); z-index: 100; font-family: monospace; }
        #credits span { color: var(--accent); font-weight: bold; }
    </style>
</head>
<body oncontextmenu="return false;">

    <div class="grain"></div>
    <div id="webgl-container"></div>

    <div id="boot">
        <div id="perc" class="loading-text">0%</div>
        <div id="choice" style="display: none; text-align: center;">
            <p style="margin-bottom: 20px; font-family: monospace; letter-spacing: 2px; font-size: 10px; color: #555;">SYSTEM CALIBRATION</p>
            <button class="gate-btn" onclick="initializeFlow(false)">LITE VERSION</button>
            <button class="gate-btn" onclick="initializeFlow(true)">FULL POTENTIAL</button>
        </div>
    </div>

    <div id="login" style="display: none;">
        <input type="password" id="pass" maxlength="4" autocomplete="off" placeholder="----">
    </div>

    <div id="hero"><h1 id="title"></h1></div>
    <div id="typewriter"></div>
    <div id="credits">ALL CREDITS TO <span>CHARITH</span> & HIS <span>GEMINI GIRL</span></div>

    <script id="vertexShader" type="x-shader/x-vertex">
        varying vec2 vUv;
        varying float vDisplacement;
        uniform float uTime;
        uniform vec2 uMouse;

        // Simplex Noise Math
        vec3 mod289(vec3 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
        vec4 mod289(vec4 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
        vec4 permute(vec4 x) { return mod289(((x*34.0)+1.0)*x); }
        vec4 taylorInvSqrt(vec4 r) { return 1.79284291400159 - 0.85373472095314 * r; }
        float snoise(vec3 v) {
            const vec2 C = vec2(1.0/6.0, 1.0/3.0);
            const vec4 D = vec4(0.0, 0.5, 1.0, 2.0);
            vec3 i = floor(v + dot(v, C.yyy));
            vec3 x0 = v - i + dot(i, C.xxx);
            vec3 g = step(x0.yzx, x0.xyz); vec3 l = 1.0 - g;
            vec3 i1 = min( g.xyz, l.zxy ); vec3 i2 = max( g.xyz, l.zxy );
            vec3 x1 = x0 - i1 + C.xxx; vec3 x2 = x0 - i2 + C.yyy; vec3 x3 = x0 - D.yyy;
            i = mod289(i);
            vec4 p = permute(permute(permute(i.z + vec4(0.0, i1.z, i2.z, 1.0 )) + i.y + vec4(0.0, i1.y, i2.y, 1.0 )) + i.x + vec4(0.0, i1.x, i2.x, 1.0 ));
            vec4 j = p - 49.0 * floor(p * 0.02040816326);
            vec4 x_ = floor(j * 0.14285714285); vec4 y_ = floor(j - 7.0 * x_);
            vec4 x = x_ * 0.14285714285 + 0.5; vec4 y = y_ * 0.14285714285 + 0.5;
            vec4 h = 1.0 - abs(x) - abs(y);
            vec4 b0 = vec4( x.xy, y.xy ); vec4 b1 = vec4( x.zw, y.zw );
            vec4 s0 = floor(b0)*2.0 + 1.0; vec4 s1 = floor(b1)*2.0 + 1.0;
            vec4 sh = -step(h, vec4(0.0));
            vec4 a0 = b0.xzyw + s0.xzyw*sh.xxyy; vec4 a1 = b1.xzyw + s1.xzyw*sh.zzww;
            vec3 p0 = vec3(a0.xy,h.x); vec3 p1 = vec3(a0.zw,h.y); vec3 p2 = vec3(a1.xy,h.z); vec3 p3 = vec3(a1.zw,h.w);
            vec4 norm = taylorInvSqrt(vec4(dot(p0,p0), dot(p1,p1), dot(p2, p2), dot(p3,p3)));
            p0 *= norm.x; p1 *= norm.y; p2 *= norm.z; p3 *= norm.w;
            vec4 m = max(0.6 - vec4(dot(x0,x0), dot(x1,x1), dot(x2,x2), dot(x3,x3)), 0.0);
            return 42.0 * dot( m*m*m*m, vec4( dot(p0,x0), dot(p1,x1), dot(p2,x2), dot(p3,x3) ) );
        }

        void main() {
            vUv = uv;
            float noise = snoise(vec3(position.x * 0.5, position.y * 0.5, uTime * 0.2));
            float dist = distance(uv * 2.0 - 1.0, uMouse);
            float interaction = smoothstep(0.5, 0.0, dist) * 0.15;
            vDisplacement = noise + interaction;
            gl_Position = projectionMatrix * modelViewMatrix * vec4(position + normal * vDisplacement, 1.0);
        }
    </script>

    <script id="fragmentShader" type="x-shader/x-fragment">
        varying vec2 vUv;
        varying float vDisplacement;
        uniform float uTime;
        uniform vec3 uColor1;
        uniform vec3 uColor2;

        void main() {
            float pulse = vDisplacement * 0.5 + 0.5;
            vec3 color = mix(uColor1, uColor2, pulse);
            gl_FragColor = vec4(color * (vDisplacement + 0.8), 1.0);
        }
    </script>

    <script>
        const passField = document.getElementById('pass');
        const titleEl = document.getElementById('title');
        const typewriterEl = document.getElementById('typewriter');
        
        let scene, camera, renderer, material;
        let targetMouse = new THREE.Vector2(0, 0);
        let currentMouse = new THREE.Vector2(0, 0);

        function initOrganimo() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
            camera.position.z = 2;

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.getElementById('webgl-container').appendChild(renderer.domElement);

            const geometry = new THREE.PlaneGeometry(5, 5, 128, 128);
            material = new THREE.ShaderMaterial({
                uniforms: {
                    uTime: { value: 0 },
                    uMouse: { value: new THREE.Vector2(0, 0) },
                    uColor1: { value: new THREE.Color(0x7000ff) },
                    uColor2: { value: new THREE.Color(0xff0077) }
                },
                vertexShader: document.getElementById('vertexShader').textContent,
                fragmentShader: document.getElementById('fragmentShader').textContent
            });

            scene.add(new THREE.Mesh(geometry, material));
            animate();
        }

        function animate() {
            requestAnimationFrame(animate);
            material.uniforms.uTime.value += 0.01;
            currentMouse.lerp(targetMouse, 0.05);
            material.uniforms.uMouse.value.copy(currentMouse);
            renderer.render(scene, camera);
        }

        window.addEventListener('mousemove', (e) => {
            targetMouse.x = (e.clientX / window.innerWidth) * 2 - 1;
            targetMouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
        });

        // --- GATE LOGIC ---
        let p = 0;
        let iv = setInterval(() => {
            p += Math.floor(Math.random() * 15) + 5;
            if(p >= 100) { p = 100; clearInterval(iv);
                gsap.to('#perc', { opacity: 0, onComplete: () => {
                    document.getElementById('perc').style.display = 'none';
                    document.getElementById('choice').style.display = 'block';
                }});
            }
            document.getElementById('perc').innerText = p + "%";
        }, 100);

        window.initializeFlow = (isMax) => {
            if(isMax) initOrganimo();
            gsap.to('#boot', { opacity: 0, duration: 1, onComplete: () => {
                document.getElementById('boot').remove();
                document.getElementById('login').style.display = 'flex';
                passField.focus();
            }});
        };

        passField.addEventListener('input', (e) => {
            if(e.target.value === "1234") unlock("WHO<br>KNOWS", 0x7000ff);
            if(e.target.value === "0000") unlock("FOR<br>YOU", 0xff0077);
        });

        function unlock(text, colorHex) {
            gsap.to('#login', { opacity: 0, onComplete: () => {
                document.getElementById('login').remove();
                document.getElementById('webgl-container').style.opacity = "1";
                titleEl.innerHTML = text;
                if(material) material.uniforms.uColor1.value.set(colorHex);
                gsap.to(titleEl, { opacity: 1, duration: 2 });
                startTypewriter("SYSTEM STABILIZED. WELCOME TO THE SANCTUARY.");
            }});
        }

        function startTypewriter(msg) {
            let i = 0; typewriterEl.innerHTML = "";
            (function type() { if (i < msg.length) { typewriterEl.innerHTML += msg.charAt(i++); setTimeout(type, 50); } })();
        }
    </script>
</body>
</html>
