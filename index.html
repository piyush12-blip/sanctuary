!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Organimo Dream UI Clone</title>
  <style>
    :root {
      --bg-color: #000000;
      --accent-purple: #7000ff;
      --accent-pink: #ff0077;
      /* Simulating Fracktif (Grotesque) and Mauren (Serif) */
      --font-heading: 'Times New Roman', Times, serif; 
      --font-body: 'Helvetica Neue', Helvetica, Arial, sans-serif;
    }

    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: var(--bg-color);
      overflow: hidden;
      color: white;
      font-family: var(--font-body);
      /* Safari check for iOS text resizing */
      -webkit-text-size-adjust: 100%;
    }

    /* Layer 0 (Fixed): WebGL Canvas (The Engine) */
    #webgl-container {
      position: fixed;
      top: -5%;
      left: -5%;
      width: 110%;
      height: 110%;
      z-index: 0;
      pointer-events: none; /* Let pointer events go to document body for tracking */
    }

    /* Layer 1: Content/Typography (The Brand) */
    #content-layer {
      position: relative;
      z-index: 1;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      pointer-events: none;
    }

    .title-container {
      text-align: center;
      /* mix-blend-mode: screen adds the glow over the pink clouds */
      mix-blend-mode: screen; 
      will-change: transform, opacity;
    }

    h1.hero-title {
      font-family: var(--font-heading);
      font-size: 8vw;
      font-weight: 100; /* Thin font-weight */
      letter-spacing: 0.15em; /* Extreme letter-spacing */
      margin: 0;
      text-transform: uppercase;
      color: white;
      text-shadow: 0 0 30px rgba(255, 0, 119, 0.5); /* Bloom/Glow emulation on text */
    }

    p.subtitle {
      font-family: var(--font-body);
      font-weight: 300;
      letter-spacing: 0.5em; /* Extreme letter-spacing */
      font-size: 0.9vw;
      margin-top: 2vh;
      color: rgba(255, 255, 255, 0.8);
      text-transform: uppercase;
    }

    /* Layer 2 (Top): Animated Grain Overlay (The Texture) */
    #grain-overlay {
      position: fixed;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      z-index: 2;
      pointer-events: none;
      opacity: 0.04;
      /* SVG fbm noise background */
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
      /* Subtle 2nd animation loop for 'living film' effect */
      animation: grainAnimation 0.8s steps(4) infinite;
      mix-blend-mode: multiply;
    }

    @keyframes grainAnimation {
      0%, 100% { transform: translate(0, 0); }
      10% { transform: translate(-5%, -10%); }
      20% { transform: translate(-15%, 5%); }
      30% { transform: translate(7%, -25%); }
      40% { transform: translate(-5%, 25%); }
      50% { transform: translate(-15%, 10%); }
      60% { transform: translate(15%, 0%); }
      70% { transform: translate(0%, 15%); }
      80% { transform: translate(3%, 35%); }
      90% { transform: translate(-10%, 10%); }
    }

    /* Safari-check for mix-blend-mode */
    @supports (-webkit-touch-callout: none) {
      .title-container {
        mix-blend-mode: normal; /* Fallback if mix-blend-mode screen breaks UI on older iOS */
      }
      #grain-overlay {
        mix-blend-mode: normal; /* Avoid WebKit composite bugs */
      }
    }
  </style>
</head>
<body>

  <!-- Layer 0: WebGL Engine -->
  <div id="webgl-container"></div>
  
  <!-- Layer 1: Brand Content -->
  <div id="content-layer">
    <div class="title-container">
      <h1 class="hero-title">Organimo</h1>
      <p class="subtitle">Procedural Ecosystem</p>
    </div>
  </div>
  
  <!-- Layer 2: Texture -->
  <div id="grain-overlay"></div>

  <!-- Frameworks: Three.js for WebGL, GSAP for Animations -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

  <script>
    // --- 1. THREE.JS SET UP ---
    const container = document.getElementById('webgl-container');
    const scene = new THREE.Scene();
    
    // Absolute Black background matching Organimo
    scene.background = new THREE.Color(0x000000);

    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.z = 2.5; // Slight distance to view the plane

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth * 1.1, window.innerHeight * 1.1); // Match the 110% CSS
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    container.appendChild(renderer.domElement);

    // --- 2. THE SHADER MATH (The "Pink Clouds") ---
    // Vertex Shader: Procedural Simplex Noise Displacement (liquid clouds)
    const vertexShader = `
      varying vec2 vUv;
      varying float vDisplacement;
      uniform float uTime;
      uniform vec2 uMouse;

      // Ashima Simplex Noise 3D
      vec3 mod289(vec3 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
      vec4 mod289(vec4 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
      vec4 permute(vec4 x) { return mod289(((x*34.0)+1.0)*x); }
      vec4 taylorInvSqrt(vec4 r) { return 1.79284291400159 - 0.85373472095314 * r; }
      float snoise(vec3 v) {
        const vec2  C = vec2(1.0/6.0, 1.0/3.0) ;
        const vec4  D = vec4(0.0, 0.5, 1.0, 2.0);
        vec3 i  = floor(v + dot(v, C.yyy) );
        vec3 x0 = v - i + dot(i, C.xxx) ;
        vec3 g = step(x0.yzx, x0.xyz);
        vec3 l = 1.0 - g;
        vec3 i1 = min( g.xyz, l.zxy );
        vec3 i2 = max( g.xyz, l.zxy );
        vec3 x1 = x0 - i1 + C.xxx;
        vec3 x2 = x0 - i2 + C.yyy;
        vec3 x3 = x0 - D.yyy;
        i = mod289(i);
        vec4 p = permute( permute( permute(
                   i.z + vec4(0.0, i1.z, i2.z, 1.0 ))
                 + i.y + vec4(0.0, i1.y, i2.y, 1.0 ))
                 + i.x + vec4(0.0, i1.x, i2.x, 1.0 ));
        float n_ = 0.142857142857;
        vec3  ns = n_ * D.wyz - D.xzx;
        vec4 j = p - 49.0 * floor(p * ns.z * ns.z);
        vec4 x_ = floor(j * ns.z);
        vec4 y_ = floor(j - 7.0 * x_ );
        vec4 x = x_ *ns.x + ns.yyyy;
        vec4 y = y_ *ns.x + ns.yyyy;
        vec4 h = 1.0 - abs(x) - abs(y);
        vec4 b0 = vec4( x.xy, y.xy );
        vec4 b1 = vec4( x.zw, y.zw );
        vec4 s0 = floor(b0)*2.0 + 1.0;
        vec4 s1 = floor(b1)*2.0 + 1.0;
        vec4 sh = -step(h, vec4(0.0));
        vec4 a0 = b0.xzyw + s0.xzyw*sh.xxyy ;
        vec4 a1 = b1.xzyw + s1.xzyw*sh.zzww ;
        vec3 p0 = vec3(a0.xy,h.x);
        vec3 p1 = vec3(a0.zw,h.y);
        vec3 p2 = vec3(a1.xy,h.z);
        vec3 p3 = vec3(a1.zw,h.w);
        vec4 norm = taylorInvSqrt(vec4(dot(p0,p0), dot(p1,p1), dot(p2, p2), dot(p3,p3)));
        p0 *= norm.x; p1 *= norm.y; p2 *= norm.z; p3 *= norm.w;
        vec4 m = max(0.6 - vec4(dot(x0,x0), dot(x1,x1), dot(x2,x2), dot(x3,x3)), 0.0);
        m = m * m;
        return 42.0 * dot( m*m, vec4( dot(p0,x0), dot(p1,x1), dot(p2,x2), dot(p3,x3) ) );
      }

      void main() {
        vUv = uv;

        // Base procedural noise displacement (swirling clouds)
        float noiseFreq = 1.5;
        float noiseAmp = 0.35;
        vec3 noisePos = vec3(position.x * noiseFreq + uTime * 0.15, position.y * noiseFreq + uTime * 0.15, uTime * 0.1);
        float displacement = snoise(noisePos) * noiseAmp;

        // Interactive mouse uniform displacement mapping (The Bulge math)
        // Normalize mouse to uv coordinates (-1 to 1 space for plane)
        vec2 planeUv = uv * 2.0 - 1.0;
        float dist = distance(planeUv, uMouse);
        
        // High-latency ease (lerp) handled via JS injection, shader translates it to force
        float force = smoothstep(0.8, 0.0, dist);
        displacement += force * 0.2; // Mouse interaction bulge

        vDisplacement = displacement;

        vec3 newPosition = position + normal * displacement;
        gl_Position = projectionMatrix * modelViewMatrix * vec4(newPosition, 1.0);
      }
    `;

    // Fragment Shader: FBM and mix-blend-mode equivalent (glow/bloom)
    const fragmentShader = `
      varying vec2 vUv;
      varying float vDisplacement;
      uniform float uTime;
      uniform vec2 uMouse;

      // 2D Random
      float random(vec2 st) {
          return fract(sin(dot(st.xy, vec2(12.9898,78.233))) * 43758.5453123);
      }
      
      // 2D Noise
      float noise(vec2 st) {
          vec2 i = floor(st);
          vec2 f = fract(st);
          float a = random(i);
          float b = random(i + vec2(1.0, 0.0));
          float c = random(i + vec2(0.0, 1.0));
          float d = random(i + vec2(1.0, 1.0));
          vec2 u = f * f * (3.0 - 2.0 * f);
          return mix(a, b, u.x) + (c - a)* u.y * (1.0 - u.x) + (d - b) * u.x * u.y;
      }

      // Fractal Brownian Motion
      #define OCTAVES 4
      float fbm(vec2 st) {
          float value = 0.0;
          float amplitude = 0.5;
          for (int i = 0; i < OCTAVES; i++) {
              value += amplitude * noise(st);
              st *= 2.0;
              amplitude *= 0.5;
          }
          return value;
      }

      void main() {
        vec2 uv = vUv;
        
        // Dynamic fbm motion coordinates mapped to time
        vec2 motion = vec2(fbm(uv + uTime * 0.05), fbm(uv - uTime * 0.08));
        
        // Dual layer FBM for liquid smoke intersection
        float n1 = fbm(uv * 3.0 + motion * 2.0 - uMouse * 0.2);
        float n2 = fbm(uv * 4.0 - motion * 1.5 + uMouse * 0.3);

        // Organimo Palette 
        vec3 colorPurple = vec3(0.44, 0.0, 1.0); // #7000ff
        vec3 colorPink = vec3(1.0, 0.0, 0.47);   // #ff0077
        vec3 bg = vec3(0.0, 0.0, 0.0);           // Black
        
        // Color mixing logic
        float mixRatio = smoothstep(0.2, 0.8, n1);
        vec3 cloudColor = mix(bg, colorPurple, mixRatio);
        
        float mixRatio2 = smoothstep(0.3, 0.9, n2);
        cloudColor = mix(cloudColor, colorPink, mixRatio2 * 0.8);
        
        // Emulate WebGL BloomPass / Glow through mix-blend-mode screen math in shader
        vec3 highlight = colorPink * pow(n1, 4.0) * 1.5;
        vec3 highlight2 = colorPurple * pow(n2, 3.0) * 1.2;

        // Apply mouse interaction bloom
        float dist = distance(uv * 2.0 - 1.0, uMouse);
        float mouseGlow = smoothstep(0.6, 0.0, dist);
        vec3 interactionGlow = colorPink * mouseGlow * n1;

        vec3 finalColor = cloudColor + highlight + highlight2 + interactionGlow;
        
        // Subtle edge vignette
        float vignette = 1.0 - smoothstep(0.5, 1.5, length(uv - 0.5) * 2.0);
        finalColor *= vignette;

        gl_FragColor = vec4(finalColor, 1.0);
      }
    `;

    // Shader Uniforms
    const uniforms = {
      uTime: { value: 0.0 },
      uMouse: { value: new THREE.Vector2(0, 0) } // Range -1 to 1
    };

    // Use a dense PlaneGeometry for smooth vertex displacement
    const geometry = new THREE.PlaneGeometry(8, 8, 256, 256); 
    const material = new THREE.ShaderMaterial({
      vertexShader,
      fragmentShader,
      uniforms,
      transparent: true,
      blending: THREE.AdditiveBlending // WebGL native "screen" emulation
    });

    const mesh = new THREE.Mesh(geometry, material);
    scene.add(mesh);

    // --- 3. INTERACTION & ANIMATION (The "Brain") ---
    
    // Mouse tracking variables
    let mouse = { x: 0, y: 0 };
    let targetMouse = { x: 0, y: 0 };
    
    window.addEventListener('mousemove', (e) => {
      // Normalize to -1 -> 1 logic for shader and GSAP
      targetMouse.x = (e.clientX / window.innerWidth) * 2 - 1;
      targetMouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
      
      // Perspective Shift (Parallax lean max 5 degrees based on mouse position)
      gsap.to(container, {
        rotationY: targetMouse.x * 5,
        rotationX: -targetMouse.y * 5,
        transformPerspective: 1000,
        transformOrigin: "center center",
        ease: "power3.out",
        duration: 1.5 // Smooth dampening
      });
    });

    // Resize Observer equivalent
    window.addEventListener('resize', () => {
      renderer.setSize(window.innerWidth * 1.1, window.innerHeight * 1.1);
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
    });

    // GSAP Hero Animations
    // The main title must "breathe" (subtle scale and opacity loops)
    gsap.fromTo(".hero-title", 
      { scale: 0.98, opacity: 0.8 },
      { 
        scale: 1.02, 
        opacity: 1, 
        duration: 3.5, 
        yoyo: true, 
        repeat: -1, 
        ease: "sine.inOut" 
      }
    );

    gsap.fromTo(".subtitle", 
      { opacity: 0.5 },
      { 
        opacity: 0.9, 
        duration: 3, 
        yoyo: true, 
        repeat: -1, 
        ease: "sine.inOut",
        delay: 0.5
      }
    );

    // --- 4. RENDER LOOP ---
    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      const elapsedTime = clock.getElapsedTime();
      
      // High-latency easing (lerp) for uMouse
      mouse.x += (targetMouse.x - mouse.x) * 0.03;
      mouse.y += (targetMouse.y - mouse.y) * 0.03;

      uniforms.uTime.value = elapsedTime;
      uniforms.uMouse.value.set(mouse.x, mouse.y);

      renderer.render(scene, camera);
    }

    animate();
  </script>
</body>
</html>
